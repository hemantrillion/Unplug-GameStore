<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Garden</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf5ee;color:#234330;font:16px system-ui;text-align:center}main{max-width:580px;margin:auto;padding:24px}h1{font-size:34px;margin:0}p{line-height:1.5}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.tile{aspect-ratio:1;border:0;border-radius:15px;font-size:32px;background:#588566;color:white;cursor:pointer}.tile:disabled{opacity:1}.tile.open{background:#fff;color:#234330}.tile.matched{background:#c8dfbc}button:focus-visible{outline:3px solid #c28231;outline-offset:3px}#reset{border:0;border-radius:10px;background:#234330;color:white;padding:12px 22px;font:inherit;cursor:pointer}
</style></head><body><main><h1>Memory Garden</h1><p>A little focus goes a long way. Find all eight pairs.</p><div id="grid" aria-label="Memory cards"></div><p id="status" role="status">Moves: 0</p><button id="reset">New garden</button></main><script>
(()=>{'use strict';const icons=['🌱','🌻','🍄','🌿','🌷','🍀','🌼','🌵'];const grid=document.querySelector('#grid'),status=document.querySelector('#status');let first=null,locked=false,moves=0,pairs=0,timer;
function reset(){clearTimeout(timer);first=null;locked=false;moves=0;pairs=0;status.textContent='Moves: 0';const deck=[...icons,...icons];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}grid.replaceChildren();deck.forEach((icon,index)=>{const b=document.createElement('button');b.className='tile';b.textContent='✦';b.setAttribute('aria-label','Hidden card '+(index+1));b.addEventListener('click',()=>{if(locked||b.disabled)return;b.classList.add('open');b.textContent=icon;b.disabled=true;b.setAttribute('aria-label',icon);if(!first){first={b,icon};return;}moves++;if(first.icon===icon){b.classList.add('matched');first.b.classList.add('matched');pairs++;first=null;status.textContent=pairs===8?'Garden complete in '+moves+' moves!':'Moves: '+moves+' · Pairs: '+pairs+'/8';}else{locked=true;const old=first.b;timer=setTimeout(()=>{for(const card of [b,old]){card.classList.remove('open');card.textContent='✦';card.disabled=false;card.setAttribute('aria-label','Hidden card');}first=null;locked=false;},850);status.textContent='Moves: '+moves+' · Pairs: '+pairs+'/8';}});grid.append(b);});}
document.querySelector('#reset').addEventListener('click',reset);reset();window.parent.postMessage({type:'unplug:ready'},'*');})();
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Trail</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1edfa;color:#423163;font:16px system-ui;text-align:center}main{max-width:520px;margin:auto;padding:20px}h1{margin:0;font-size:34px}canvas{width:min(100%,380px);background:#fff;border-radius:18px;touch-action:none}p{line-height:1.5}button{border:0;border-radius:10px;padding:12px 20px;background:#71529e;color:white;font:inherit;cursor:pointer}.controls{display:flex;gap:8px;justify-content:center;margin:14px}button:focus-visible{outline:3px solid #222;outline-offset:3px}
</style></head><body><main><h1>Neon Trail</h1><p>Use arrows or the controls. Collect sparks, avoid your trail.</p><canvas id="game" width="380" height="380" tabindex="0" aria-label="Snake game. Use arrow keys."></canvas><div class="controls"><button data-dir="left" aria-label="Left">←</button><button data-dir="up" aria-label="Up">↑</button><button data-dir="down" aria-label="Down">↓</button><button data-dir="right" aria-label="Right">→</button></div><p id="status" role="status">Sparks: 0</p><button id="restart">New trail</button></main><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let snake,food,dir,next,running,score,previous=0;const size=19;const directions={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};function spawn(){const free=[];for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});food=free[Math.floor(Math.random()*free.length)];if(!food){running=false;status.textContent='You filled the garden!';}}
function reset(){snake=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];dir=[1,0];next=dir;score=0;running=true;spawn();status.textContent='Sparks: 0';canvas.focus();}
function turn(name){const d=directions[name];if(d&&(d[0]!==-dir[0]||d[1]!==-dir[1]))next=d;}
window.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){e.preventDefault();turn(e.key.slice(5).toLowerCase());}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>turn(b.dataset.dir)));document.querySelector('#restart').addEventListener('click',reset);
function tick(){if(!running)return;dir=next;const head={x:snake[0].x+dir[0],y:snake[0].y+dir[1]},eat=head.x===food.x&&head.y===food.y;const body=eat?snake:snake.slice(0,-1);if(head.x<0||head.y<0||head.x>=size||head.y>=size||body.some(p=>p.x===head.x&&p.y===head.y)){running=false;status.textContent='Trail ended. Sparks: '+score;return;}snake.unshift(head);if(eat){score++;status.textContent='Sparks: '+score;spawn();}else snake.pop();}
function frame(now){if(now-previous>130){tick();previous=now;}ctx.clearRect(0,0,380,380);snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#513572':'#ac91cc';ctx.beginPath();ctx.roundRect(p.x*20+1,p.y*20+1,18,18,5);ctx.fill();});if(food){ctx.fillStyle='#e1a743';ctx.beginPath();ctx.arc(food.x*20+10,food.y*20+10,7,0,Math.PI*2);ctx.fill();}requestAnimationFrame(frame);}reset();requestAnimationFrame(frame);window.parent.postMessage({type:'unplug:ready'},'*');})();
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Garden</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf5ee;color:#234330;font:16px system-ui;text-align:center}main{max-width:580px;margin:auto;padding:16px}h1{font-size:28px;margin:0 0 4px 0}p{line-height:1.4;margin:4px}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px auto;max-width:380px}.tile{aspect-ratio:1;border:0;border-radius:12px;font-size:28px;background:#588566;color:white;cursor:pointer}.tile:disabled{opacity:1}.tile.open{background:#fff;color:#234330}.tile.matched{background:#c8dfbc}#reset{border:0;border-radius:10px;background:#234330;color:white;padding:12px 22px;font:inherit;font-weight:bold;cursor:pointer}#hint-btn{border:0;border-radius:10px;background:#c28231;color:white;padding:12px 22px;font:inherit;font-weight:bold;cursor:pointer;margin-left:8px}
</style></head><body><main><h1>Memory Garden</h1><p>Match all eight floral pairs.</p><div id="grid" aria-label="Memory cards"></div><p id="status" role="status" style="font-weight:bold;font-size:18px">Moves: 0 · Pairs: 0/8</p><button id="reset">Restart</button><button id="hint-btn">💡 Hint</button></main><script>
(()=>{'use strict';const icons=['🌱','🌻','🍄','🌿','🌷','🍀','🌼','🌵'];const grid=document.querySelector('#grid'),status=document.querySelector('#status');let first=null,locked=false,moves=0,pairs=0,timer;let allButtons=[];
function reset(){clearTimeout(timer);first=null;locked=false;moves=0;pairs=0;allButtons=[];status.textContent='Moves: 0 · Pairs: 0/8';const deck=[...icons,...icons];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}grid.replaceChildren();deck.forEach((icon,index)=>{const b=document.createElement('button');b.className='tile';b.textContent='✦';b.dataset.icon=icon;b.addEventListener('click',()=>{if(locked||b.disabled)return;b.classList.add('open');b.textContent=icon;b.disabled=true;if(!first){first={b,icon};return;}moves++;if(first.icon===icon){b.classList.add('matched');first.b.classList.add('matched');pairs++;first=null;status.textContent=pairs===8?'Garden complete in '+moves+' moves! 🎉':'Moves: '+moves+' · Pairs: '+pairs+'/8';if(pairs===8){window.parent.postMessage({type:'unplug:score',score:Math.max(10,100-moves*2),game:'memory'},'*');}}else{locked=true;const old=first.b;timer=setTimeout(()=>{for(const card of [b,old]){card.classList.remove('open');card.textContent='✦';card.disabled=false;}first=null;locked=false;},850);status.textContent='Moves: '+moves+' · Pairs: '+pairs+'/8';}});allButtons.push(b);grid.append(b);});}

function triggerHint(){
  // Reveal all unmatched cards for 2 seconds
  allButtons.forEach(b=>{if(!b.classList.contains('matched')){b.textContent=b.dataset.icon;b.classList.add('open');}});
  setTimeout(()=>{allButtons.forEach(b=>{if(!b.classList.contains('matched')){b.textContent='✦';b.classList.remove('open');}});},2000);
}

document.querySelector('#hint-btn').addEventListener('click',()=>{
  window.parent.postMessage({type:'unplug:req_hint',game:'memory'},'*');
  triggerHint();
});

window.addEventListener('message',e=>{
  if(!e.data)return;
  if(e.data.type==='unplug:hint')triggerHint();
});

document.querySelector('#reset').addEventListener('click',reset);reset();window.parent.postMessage({type:'unplug:ready'},'*');})();
</script></body></html>

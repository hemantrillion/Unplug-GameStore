<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <title>UNPLUG Mobile Arcade</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Main Arcade Container -->
  <div id="arcade-app">
    <!-- Header -->
    <header class="arcade-header">
      <div class="brand">
        <span class="brand-icon">🕹️</span>
        <div class="brand-text">
          <span class="brand-name">UNPLUG</span>
          <span class="brand-sub">ARCADE</span>
        </div>
      </div>
      <div class="header-status">
        <span class="status-pill" id="catalog-status">● 1 Game Ready</span>
      </div>
    </header>

    <!-- Games Shelf -->
    <main class="arcade-main">
      <div class="shelf-header">
        <div>
          <h1 class="shelf-title">Game Library</h1>
          <p class="shelf-desc">Tap any approved game to play instantly. 100% offline ready.</p>
        </div>
      </div>

      <!-- Dynamic Game Cards Container -->
      <div id="games-container" class="games-shelf">
        <!-- Injected dynamically based on approved catalog -->
      </div>
    </main>

    <!-- Fullscreen Player Modal -->
    <div id="player-modal" class="player-modal" aria-hidden="true">
      <div class="player-header">
        <div class="player-info">
          <span class="player-game-title" id="active-game-title">Game Title</span>
          <span class="player-best-badge" id="player-best-score">Best: 0</span>
        </div>
        <div class="player-actions">
          <button class="player-btn btn-restart" id="btn-restart-game" title="Restart Game">🔄 Restart</button>
          <button class="player-btn btn-exit" id="btn-exit-game" title="Exit to Library">✕ Exit</button>
        </div>
      </div>
      <div class="player-viewport">
        <iframe id="game-frame" class="game-frame" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>

    <!-- Rewarded Ad Overlay -->
    <div id="ad-overlay" class="dialog-overlay" aria-hidden="true">
      <div class="dialog-card ad-dialog">
        <div class="ad-tag">⚡ SPONSORED REWARD AD</div>
        <div class="ad-visual">
          <div class="ad-anim-spark">✨</div>
          <h3>UNPLUG Mobile Engine</h3>
          <p>Zero tracking. Verified sandboxed games. Instant offline play.</p>
          <div class="ad-progress-box">
            <div class="ad-progress-bar" id="ad-progress-bar"></div>
          </div>
          <div class="ad-timer-text">Reward unlocks in <b id="ad-countdown">5</b>s</div>
        </div>
        <button id="claim-reward-btn" class="primary-btn" disabled>Watching Sponsor...</button>
        <button id="skip-ad-btn" class="text-btn">✕ Skip & End Run</button>
      </div>
    </div>
  </div>

  <script src="catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
